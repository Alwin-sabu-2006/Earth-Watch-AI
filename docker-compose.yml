version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: earthwatch-backend
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - DATABASE_URL=sqlite:///./database/earthwatch.db
      - NASA_API_KEY=DEMO_KEY
    volumes:
      - ./database:/app/database
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: earthwatch-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
